# Builds and tests Mend on Windows, macOS and Linux on every push and pull
# request, and packages release archives and installers. Pushing a tag such as v0.8.0
# publishes those archives as a GitHub release.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases from tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15-intel # Intel runner (shorter queues); still builds universal (arm64 + x86_64) binaries
            platform: macos
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: version
        run: |
          v=$(sed -n 's/^project(Mend VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxcursor-dev \
            libxrandr-dev libdbus-1-dev libjack-jackd2-dev

      - name: Windows toolchain (MinGW-w64 via MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja zip

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" -DCMAKE_SHARED_LINKER_FLAGS="-static"
          cmake --build build
          ctest --test-dir build --output-on-failure
          scripts/package.sh build windows ${{ steps.version.outputs.version }} dist

      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          cmake --build build -j4
          ctest --test-dir build --output-on-failure
          scripts/package.sh build macos ${{ steps.version.outputs.version }} dist
          bash installer/macos/build-pkg.sh dist/Mend-${{ steps.version.outputs.version }}-macos ${{ steps.version.outputs.version }} dist

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ctest --test-dir build --output-on-failure
          scripts/package.sh build linux ${{ steps.version.outputs.version }} dist

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DVersion=$v" "/DStage=$PWD\dist\Mend-$v-windows" "/DOutputDir=$PWD\dist" installer\windows\Mend.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v6
        with:
          name: Mend-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.pkg

  release:
    # Publish whatever built, so a stuck or failed Mac job doesn't block the
    # Windows and Linux downloads. Re-run the release later to add the rest.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.pkg
